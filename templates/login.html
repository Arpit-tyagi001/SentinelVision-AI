{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 60px auto;">
    <h2>Admin Login</h2>

    {% if error %}
    <p style="color: #ef4444; font-weight: bold;">{{ error }}</p>
    {% endif %}

    <form method="POST" action="/login">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required style="width:100%; padding:10px; margin-bottom:15px;">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required style="width:100%; padding:10px; margin-bottom:20px;">

        <button type="submit" class="btn primary" style="width:100%;">Login</button>
    </form>
</div>
{% endblock %}
