{% extends "base.html" %}
{% block title %}Register Student{% endblock %}
{% block content %}
<div class="card">
    <h2>Register New Student</h2>
    <form id="registerForm">
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" required />
        </div>
        <div class="form-group">
            <label>Roll Number</label>
            <input type="text" id="roll_no" required />
        </div>
        <div class="form-group">
            <label>Class</label>
            <input type="text" id="class" required />
        </div>
        <div class="form-group">
            <label>Capture Face (click button below)</label>
            <button type="button" id="captureBtn" class="btn primary">📸 Capture 5 Images</button>
            <div id="captureStatus">Not captured yet</div>
        </div>
        <button type="submit" class="btn success">Register</button>
    </form>
</div>
{% endblock %}
